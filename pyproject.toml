[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inaba-ai"
version = "0.1.0"
description = "Inaba AI dual-runtime control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = []
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
