services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: inaba-postgres
    env_file:
      - ${INABA_ENV_FILE:-/etc/inaba/inaba.env}
    expose:
      - "5432"
    volumes:
      - ${INABA_POSTGRES_DATA_DIR:-/opt/inaba-data/postgres}:/var/lib/postgresql/data
    networks:
      - inaba_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    image: ${INABA_CORE_IMAGE:-inaba-core:latest}
    container_name: inaba-core
    env_file:
      - ${INABA_ENV_FILE:-/etc/inaba/inaba.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INABA_CORE_PORT:-8000}:8000"
    volumes:
      - ${INABA_KNOWLEDGE_DATA_DIR:-/opt/inaba-data/knowledge}:/data/knowledge
      - ${INABA_BACKUP_DIR:-/opt/inaba-backups}:/data/backups
    networks:
      - inaba_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inaba_internal:
    name: inaba_internal
