services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: inaba
      POSTGRES_USER: inaba
      POSTGRES_PASSWORD: inaba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inaba -d inaba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: